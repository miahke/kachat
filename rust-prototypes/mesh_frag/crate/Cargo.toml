[package]
name = "mesh_frag"
version = "0.1.0"
edition = "2021"
description = "Isolated Rust prototype: bitchat mesh packet codec + fragment verify/reassemble, byte-compatible with flutter/lib/services/mesh"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
